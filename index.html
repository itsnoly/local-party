<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Local Party</title>

    <!-- Estilos Externos -->
    <link href="https://vjs.zencdn.net/7.10.2/video-js.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <link rel="stylesheet" href="index.css">

    <!-- Ícones FontAwesome -->
    <script src="https://kit.fontawesome.com/abc159cb0a.js" crossorigin="anonymous"></script>

    <!-- Socket.IO & Scripts da Aplicação -->
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script defer src="render.js"></script>
  </head>

  <body>
    <!-- 1. Tela Inicial (Landing Page) -->
    <section class="page-view landing-view" id="landing">
      <div class="card-glass text-center p-4">
        <div class="logo-box mb-3">
          <div class="hero-logo-icon">
            <i class="fas fa-play"></i>
          </div>
        </div>
        <h1 class="head-title mb-1">Local Party</h1>
        <p class="text-muted mb-4 fs-6">Assista a vídeos sincronizados com seus amigos</p>
        
        <div class="d-grid gap-3 col-12 col-md-10 mx-auto">
          <button class="btn btn-custom btn-primary-custom" id="createRoomButton">
            <i class="fas fa-plus-circle me-2"></i>Criar Sala
          </button>
          <button class="btn btn-custom btn-secondary-custom" id="joinRoomButton">
            <i class="fas fa-sign-in-alt me-2"></i>Entrar numa Sala
          </button>
        </div>
      </div>
    </section>

    <!-- 2. Tela de Criação de Sala -->
    <section class="page-view create-view" id="create">
      <div class="card-glass p-4">
        <div class="d-flex align-items-center mb-3">
          <i class="fas fa-arrow-left back-btn me-3" id="backButtonFromCreate"></i>
          <h2 class="page-title m-0">Criar Sala</h2>
        </div>
        <p id="createRoomText" class="error-msg text-center"></p>
        
        <div class="form-group mb-3">
          <label class="form-label">Nome de usuário</label>
          <input type="text" id="create-username" class="form-control custom-input" placeholder="Seu apelido" autocomplete="off">
        </div>
        
        <div class="form-group mb-3">
          <label class="form-label">Nome da sala</label>
          <input type="text" id="roomname" class="form-control custom-input" placeholder="Ex: Cinema em Casa" autocomplete="off">
        </div>

        <!-- Seleção do tipo de mídia -->
        <div class="form-group mb-3">
          <label class="form-label">Fonte do Vídeo</label>
          <div class="btn-group w-100 mb-2">
            <button type="button" class="btn btn-type active" id="btnCreateTypeFile">
              <i class="fas fa-folder-open me-2"></i>Arquivo Local
            </button>
            <button type="button" class="btn btn-type" id="btnCreateTypeUrl">
              <i class="fas fa-link me-2"></i>Link MP4 (URL)
            </button>
          </div>
        </div>

        <!-- Opção A: Arquivo Local -->
        <div class="form-group mb-4" id="createSectionFile">
          <label class="form-label"><i class="fas fa-folder-open me-1"></i> Selecione o vídeo do dispositivo</label>
          <input type="file" class="form-control custom-input file-input" id="createFileInput">
        </div>

        <!-- Opção B: URL MP4 -->
        <div class="form-group mb-4 d-none" id="createSectionUrl">
          <label class="form-label"><i class="fas fa-link me-1"></i> Link direto do arquivo .mp4</label>
          <input type="url" id="createUrlInput" class="form-control custom-input" placeholder="https://exemplo.com/video.mp4">
        </div>

        <button class="btn btn-custom btn-primary-custom w-100" id="roomCreateButton">
          Criar e Iniciar
        </button>
      </div>
    </section>

    <!-- 3. Tela de Entrada em Sala -->
    <section class="page-view join-view" id="join">
      <div class="card-glass p-4">
        <div class="d-flex align-items-center mb-3">
          <i class="fas fa-arrow-left back-btn me-3" id="backButtonFromJoin"></i>
          <h2 class="page-title m-0">Entrar na Sala</h2>
        </div>
        <p id="joinRoomText" class="error-msg text-center"></p>

        <div class="form-group mb-3">
          <label class="form-label">Nome de usuário</label>
          <input type="text" id="join-username" class="form-control custom-input" placeholder="Seu apelido" autocomplete="off">
        </div>

        <div class="form-group mb-3">
          <label class="form-label">Código da Sala</label>
          <input type="text" id="roomCode" class="form-control custom-input" placeholder="Código de 5 dígitos" autocomplete="off">
        </div>

        <!-- Seleção do tipo de mídia -->
        <div class="form-group mb-3">
          <label class="form-label">Fonte do Vídeo</label>
          <div class="btn-group w-100 mb-2">
            <button type="button" class="btn btn-type active" id="btnJoinTypeFile">
              <i class="fas fa-folder-open me-2"></i>Arquivo Local
            </button>
            <button type="button" class="btn btn-type" id="btnJoinTypeUrl">
              <i class="fas fa-link me-2"></i>Link MP4 (URL)
            </button>
          </div>
        </div>

        <!-- Opção A: Arquivo Local -->
        <div class="form-group mb-4" id="joinSectionFile">
          <label class="form-label"><i class="fas fa-folder-open me-1"></i> Selecione o mesmo arquivo do host</label>
          <input type="file" class="form-control custom-input file-input" id="joinFileInput">
        </div>

        <!-- Opção B: URL MP4 -->
        <div class="form-group mb-4 d-none" id="joinSectionUrl">
          <label class="form-label"><i class="fas fa-link me-1"></i> Link direto do arquivo .mp4</label>
          <input type="url" id="joinUrlInput" class="form-control custom-input" placeholder="https://exemplo.com/video.mp4">
        </div>

        <button class="btn btn-custom btn-primary-custom w-100" id="roomJoinButton">
          Entrar na Festa
        </button>
      </div>
    </section>

    <!-- 4. Interface da Sala de Vídeo e Chat -->
    <main class="room-wrapper" id="room">
      <!-- Player de Vídeo Estático -->
      <section class="video-section">
        <div class="video-container">
          <video id="video-player" class="video-js vjs-big-play-centered" controls preload="metadata">
            <source id="videoSrc" src="" type="video/mp4" />
          </video>
        </div>
      </section>

      <!-- Sidebar do Chat -->
      <aside class="chat-section">
        <header class="chat-header">
          <div class="d-flex align-items-center justify-content-between w-100">
            <div class="d-flex align-items-center gap-2">
              <button class="btn-leave" id="roomLeaveButton" title="Sair da Sala">
                <i class="fas fa-sign-out-alt"></i>
              </button>
              <h6 class="room-title mb-0" id="roomNameText">Nome da Sala</h6>
            </div>
            
            <div class="d-flex align-items-center gap-2">
              <span class="room-code-badge" id="roomCodeText" title="Clique para copiar">----</span>
              <span id="pplinparty" class="members-badge" title="Pessoas na sala: 1">
                <i class="fas fa-users me-1"></i><span id="memberCount">1</span>
              </span>
            </div>
          </div>
        </header>

        <!-- Caixa de Mensagens -->
        <div class="messages-container" id="messages-box"></div>

        <!-- Form de Digitação -->
        <footer class="chat-input-container">
          <form id="send-form" class="d-flex gap-2">
            <input 
              autocomplete="off"
              class="form-control custom-input chat-input"
              type="text"
              name="messageInp"
              id="messageInp"
              placeholder="Digite sua mensagem..."
            >
            <button type="submit" class="btn btn-send" id="sendBtn">
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </footer>
      </aside>
    </main>

    <!-- Bootstrap Bundle Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  </body>
</html>
