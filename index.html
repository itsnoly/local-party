<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Local Party</title>
    <!-- Video.js -->
    <link href="https://vjs.zencdn.net/7.10.2/video-js.css" rel="stylesheet" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <script src="https://kit.fontawesome.com/abc159cb0a.js" crossorigin="anonymous"></script>
    <!-- Notyf -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <link rel="stylesheet" href="index.css">
    <script defer src="render.js"></script>
  </head>
  <body>
    <!-- Landing Page -->
    <div class="page-container landing" id="landing">
      <div class="card-glass text-center p-4">
        <!-- Logo Moderno SVG -->
        <div class="logo-box mb-3">
          <div class="hero-logo-icon">
            <i class="fas fa-play"></i>
          </div>
        </div>
        <h1 class="head-title mb-1">Local Party</h1>
        <p class="text-muted mb-4 fs-6">Assista a vídeos sincronizados com seus amigos</p>
        <div class="d-grid gap-3 col-12 col-md-10 mx-auto">
          <button class="btn btn-custom btn-primary-custom" id="createRoomButton">
            <i class="fas fa-plus-circle me-2"></i>Criar Sala
          </button>
          <button class="btn btn-custom btn-secondary-custom" id="joinRoomButton">
            <i class="fas fa-sign-in-alt me-2"></i>Entrar numa Sala
          </button>
        </div>
      </div>
    </div>

    <!-- Create Page -->
    <div class="page-container create" id="create">
      <div class="card-glass p-4">
        <div class="d-flex align-items-center mb-3">
          <i class="fas fa-arrow-left back-btn me-3" id="backButton"></i>
          <h2 class="page-title m-0">Criar Sala</h2>
        </div>
        <p id="createRoomText" class="error-msg text-center"></p>
        
        <div class="form-group mb-3">
          <label class="form-label">Nome de usuário</label>
          <input type="text" id="create-username" class="form-control custom-input" placeholder="Seu apelido" autocomplete="off" required>
        </div>
        
        <div class="form-group mb-3">
          <label class="form-label">Nome da sala</label>
          <input type="text" id="roomname" class="form-control custom-input" placeholder="Ex: Cinema em Casa" autocomplete="off" required>
        </div>

        <!-- Opção de Fonte de Vídeo (Arquivo ou URL) -->
        <div class="form-group mb-3">
          <label class="form-label">Fonte do Vídeo</label>
          <div class="btn-group w-100 mb-2" role="group">
            <button type="button" class="btn btn-type active" id="btnTypeFile">📁 Arquivo Local</button>
            <button type="button" class="btn btn-type" id="btnTypeUrl">🔗 Link MP4 (URL)</button>
          </div>
        </div>

        <div class="form-group mb-4" id="sectionLocalFile">
          <label class="form-label">Selecione o vídeo do seu dispositivo</label>
          <input type="file" class="form-control custom-input file-input" id="file-id" onchange="onChangeFile();">
        </div>

        <div class="form-group mb-4 d-none" id="sectionUrlLink">
          <label class="form-label">Cole o link direto do arquivo .mp4</label>
          <input type="url" id="videoUrlInput" class="form-control custom-input" placeholder="https://exemplo.com/video.mp4" onchange="onChangeUrl();">
        </div>

        <button class="btn btn-custom btn-primary-custom w-100" id="roomCreateButton">
          Criar e Iniciar
        </button>
      </div>
    </div>

    <!-- Join Page -->
    <div class="page-container join" id="join">
      <div class="card-glass p-4">
        <div class="d-flex align-items-center mb-3">
          <i class="fas fa-arrow-left back-btn me-3" id="backButton"></i>
          <h2 class="page-title m-0">Entrar na Sala</h2>
        </div>
        <p id="joinRoomText" class="error-msg text-center"></p>

        <div class="form-group mb-3">
          <label class="form-label">Nome de usuário</label>
          <input type="text" id="join-username" class="form-control custom-input" placeholder="Seu apelido" autocomplete="off" required>
        </div>

        <div class="form-group mb-3">
          <label class="form-label">Código da Sala</label>
          <input type="text" id="roomCode" class="form-control custom-input" placeholder="Código de 5 dígitos" autocomplete="off" required>
        </div>

        <div class="form-group mb-4">
          <label class="form-label">Seu Arquivo de Vídeo (Se for sala local)</label>
          <input type="file" class="form-control custom-input file-input" id="join-file-id" onchange="onChangeJoinFile();">
        </div>

        <button class="btn btn-custom btn-primary-custom w-100" id="roomJoinButton">
          Entrar na Festa
        </button>
      </div>
    </div>

    <!-- Room Page -->
    <div class="room-wrapper" id="room">
      <!-- Top / Left: Video Player -->
      <div class="video-section">
        <div class="video-container">
          <video
            id="video-player"
            class="video-js vjs-big-play-centered"
            controls
            preload="metadata"
            data-setup='{}'
          >
            <source id="videoSrc" src="" type="video/mp4" />
          </video>
        </div>
      </div>

      <!-- Bottom / Right: Chat Sidebar -->
      <div class="chat-section">
        <!-- Room Info Header -->
        <div class="chat-header">
          <div class="d-flex align-items-center justify-content-between w-100">
            <div class="d-flex align-items-center gap-2">
              <button class="btn-leave" id="roomLeaveButton" data-toggle="tooltip" title="Sair da Sala">
                <i class="fas fa-sign-out-alt"></i>
              </button>
              <h6 class="room-title mb-0" id="roomNameText">Nome da Sala</h6>
            </div>
            
            <div class="d-flex align-items-center gap-2">
              <span class="room-code-badge" id="roomCodeText" title="Clique para copiar">----</span>
              <span id="pplinparty" class="members-badge" title="Pessoas na sala: 1">
                <i class="fas fa-users me-1"></i><span id="memberCount">1</span>
              </span>
            </div>
          </div>
        </div>

        <!-- Scrollable Messages Box -->
        <div class="messages-container" id="messages-box">
          <!-- User & system messages are appended here dynamically -->
        </div>

        <!-- Chat Input Form -->
        <div class="chat-input-container">
          <form id="send-form" class="d-flex gap-2">
            <input 
              autocomplete="off"
              class="form-control custom-input chat-input"
              type="text"
              name="messageInp"
              id="messageInp"
              placeholder="Digite sua mensagem..."
            >
            <button type="submit" class="btn btn-send">
              <i class="fas fa-paper-plane"></i>
            </button>
          </form>
        </div>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://local-party.herokuapp.com/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  </body>
</html>
